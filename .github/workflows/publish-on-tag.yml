name: Publish release on pushing the tag

on:
  push:
    tags:
      - '*'

env:
  BUILD_TYPE: Release

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7

    - name: Refresh system packager mirrors and packages
      run: sudo apt-get -y update

    - name: Install dependencies
      run: sudo apt-get install libpulse-dev

    - name: Build emulator
      run: |
        cmake -B ${{github.workspace}}/build_emulator -DCMAKE_BUILD_TYPE=${{env.BUILD_TYPE}} emulator
        cmake --build ${{github.workspace}}/build_emulator --config ${{env.BUILD_TYPE}}
        cp ${{github.workspace}}/build_emulator/emulator ${{github.workspace}}/build_emulator/emulator-ubuntu

    - name: Build test projects
      working-directory: ${{github.workspace}}/projects
      run: ./build.sh

    - uses: ncipollo/release-action@v1
      with:
        body: "Emulator executable for Ubuntu and compiled sample locomotive projects."
        artifacts: "${{github.workspace}}/build_emulator/emulator-ubuntu,${{github.workspace}}/projects/*.prj"
